<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tasty Bakery and Cafe — Menu</title>
  <meta name="description" content="Menu and prices at Tasty Bakery and Cafe, Addis Ababa.">
  <meta name="theme-color" content="#7F1716">
  <meta name="color-scheme" content="light">

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=Noto+Sans+Ethiopic:wght@600;700&family=Poppins:wght@400&display=swap">
  <!-- Heavy display face, downloaded only for the letters in "Menu" -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&text=Menu&display=swap">

  <link rel="preload" as="image" href="assets/logo.webp">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="edge edge--top" aria-hidden="true"></div>

  <header class="hero">
    <h1 class="hero__title">Menu</h1>
    <img class="hero__logo" src="assets/logo.webp" width="346" height="320"
         alt="Tasty Bakery and Cafe">
  </header>

  <nav class="bar" id="bar" aria-label="Menu sections">
    <div class="bar__chips" id="chips"></div>
    <button class="bar__btn" id="searchOpen" type="button" aria-label="Search the menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
    </button>

    <form class="bar__search" id="searchForm" role="search" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <input id="searchInput" type="search" inputmode="search" autocomplete="off"
             placeholder="Search food or drink…" aria-label="Search food or drink">
      <button class="bar__btn" id="searchClose" type="button" aria-label="Close search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </form>
  </nav>

  <main id="menu" class="menu" aria-live="polite"></main>

  <p class="empty" id="empty" hidden></p>

  <footer class="foot">
    <div class="edge edge--bottom" aria-hidden="true"></div>
    <div class="foot__inner">
      <img src="assets/logo-light.webp" width="346" height="320" alt="Tasty Bakery and Cafe" loading="lazy">
      <p>All prices are in Ethiopian Birr (ETB)</p>
    </div>
  </footer>

  <button class="to-top" id="toTop" type="button" aria-label="Back to top">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6"/></svg>
  </button>

  <noscript>
    <p class="noscript">Please turn on JavaScript to see the menu.</p>
  </noscript>

  <script src="js/menu-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
